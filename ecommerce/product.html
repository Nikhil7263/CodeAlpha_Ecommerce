<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product — LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/main.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-logo">LUXE</a>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Shop</a></li>
    <li><a href="index.html#collections">Collections</a></li>
    <li><a href="index.html#about">About</a></li>
  </ul>
  <div class="nav-right">
    <a href="login.html" class="icon-btn" title="Account">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <button class="icon-btn cart-icon" id="cartBtn" title="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>
</nav>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" id="closeCart">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="empty-cart">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/></svg>
      <p>Your cart is empty</p>
    </div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span>Free</span></div>
      <div class="summary-row total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    </div>
    <a href="checkout.html" class="btn-primary full">Proceed to Checkout</a>
    <button class="btn-ghost full" id="continueShopping">Continue Shopping</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<!-- BREADCRUMB -->
<div class="breadcrumb-bar">
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <a href="index.html">Shop</a>
      <span>›</span>
      <span id="breadcrumbName">Product</span>
    </nav>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<section class="product-detail-section">
  <div class="container">
    <div class="product-detail" id="productDetail">
      <!-- Injected by JS -->
    </div>
  </div>
</section>

<!-- RELATED PRODUCTS -->
<section class="related-section">
  <div class="container">
    <h2 class="related-title">You May Also Like</h2>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<footer class="footer">
  <div class="footer-bottom" style="border-top:none; padding:2rem 0;">
    <p>© 2026 LUXE Store. All rights reserved.</p>
  </div>
</footer>

<script src="static/js/data.js"></script>
<script src="static/js/cart.js"></script>
<script src="static/js/product.js"></script>
</body>
</html>
